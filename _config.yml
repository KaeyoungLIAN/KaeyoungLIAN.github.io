title: Kaeyoung
description: 个人作品集
author: Kaeyoung
email: kaeyounglk@outlook.com
url: https://kaeyounglian.github.io
baseurl: ""

# Social
github_username: KaeyoungLIAN

# Build settings
markdown: kramdown
theme: null

collections:
  works:
    output: true
    permalink: /works/:path/

defaults:
  - scope:
      path: ""
      type: works
    values:
      layout: work
  - scope:
      path: ""
      type: pages
    values:
      layout: default

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - .github/
  - react/
  - node_modules/

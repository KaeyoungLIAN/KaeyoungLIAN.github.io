<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Kaeyoung</title>
  <script>
    // GitHub Pages SPA redirect: save the requested path, go to root
    sessionStorage.redirect = location.pathname + location.search + location.hash;
    location.replace('/');
  </script>
</head>
<body>
  <script>
    // If the redirect didn't work (direct file request), fallback
    if (sessionStorage.redirect && sessionStorage.redirect !== '/') {
      document.write('<p>Redirecting to <a href="/">homepage</a>...</p>');
    }
  </script>
</body>
</html>

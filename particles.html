<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Particle Cloud — Kaeyoung</title>
  <meta name="description" content="Three.js particle cloud showcase">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0d0d0f; font-family: system-ui, -apple-system, sans-serif; }
    #c { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; }
    canvas { display: block; }
    #ui {
      position: fixed; bottom: 36px; left: 50%; transform: translateX(-50%);
      z-index: 10; text-align: center; pointer-events: none;
    }
    #ui a {
      display: inline-block; padding: 7px 16px;
      border: 1px solid rgba(255,255,255,0.12); border-radius: 8px;
      color: rgba(255,255,255,0.4); font-size: 13px; text-decoration: none;
      transition: all 0.3s ease; pointer-events: auto;
      backdrop-filter: blur(8px); background: rgba(13,13,15,0.3);
    }
    #ui a:hover { border-color: rgba(41,151,255,0.3); color: #fff; }
  </style>
</head>
<body>
  <div id="c"></div>
  <div id="ui"><a href="/">← Back</a></div>

  <script src="/assets/js/three.min.js"></script>
  <script src="/assets/js/particles-page.js"></script>
</body>
</html>

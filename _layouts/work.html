---
layout: default
---

<div class="work-outer">
  <article class="work-detail">
    <a href="{{ '/' | relative_url }}" class="back-link">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
      Back
    </a>

    <header class="work-header">
      <h1>{{ page.title }}</h1>
      <div class="work-meta">
        {% if page.tech %}
        <div class="tech-tags">
          {% for t in page.tech %}
          <span class="tech-tag">{{ t }}</span>
          {% endfor %}
        </div>
        {% endif %}
        {% if page.date %}
        <time class="work-date">{{ page.date | date: '%Y-%m' }}</time>
        {% endif %}
      </div>
    </header>

    <div class="work-content">
      {{ content }}
    </div>

    {% if page.github %}
    <div class="work-actions">
      <a href="{{ page.github }}" class="btn" target="_blank" rel="noopener">
        View Source
        <span class="btn-icon">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="19" x2="19" y2="5"/><polyline points="12 5 19 5 19 12"/>
          </svg>
        </span>
      </a>
    </div>
    {% endif %}
  </article>
</div>

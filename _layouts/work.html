---
layout: default
---

<div class="work-outer">
  <a href="{{ '/' | relative_url }}" class="back-link">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"/>
    </svg>
    Back
  </a>

  <article class="work-detail">
    <header class="work-header">
      <h1>{{ page.title }}</h1>
      <div class="work-meta">
        {% if page.tech %}
        <div class="tech-tags">
          {% for t in page.tech %}
          <span class="tech-tag">{{ t }}</span>
          {% endfor %}
        </div>
        {% endif %}
        {% if page.date %}
        <time class="work-date">{{ page.date | date: '%Y-%m' }}</time>
        {% endif %}
      </div>
    </header>

    <div class="work-content">
      {{ content }}
    </div>

    {% if page.github %}
    <div class="work-actions">
      <a href="{{ page.github }}" class="btn-primary" target="_blank" rel="noopener">View Source</a>
    </div>
    {% endif %}
  </article>
</div>

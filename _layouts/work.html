---
layout: default
---

<article class="work-detail">
  <a href="{{ '/' | relative_url }}" class="back-link">&#8592; Back</a>

  <header class="work-header">
    <h1>{{ page.title }}</h1>
    <div class="work-meta">
      {% if page.tech %}
      <div class="tech-tags">
        {% for t in page.tech %}
        <span class="tech-tag">{{ t }}</span>
        {% endfor %}
      </div>
      {% endif %}
      {% if page.date %}
      <time class="work-date">{{ page.date | date: '%Y-%m' }}</time>
      {% endif %}
    </div>
  </header>

  <div class="work-content">
    {{ content }}
  </div>

  {% if page.github %}
  <div class="work-actions">
    <a href="{{ page.github }}" class="btn" target="_blank" rel="noopener">View Source</a>
  </div>
  {% endif %}
</article>
